<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - Staff Hub</title>
    <style>
        :root {
            --primary: #3498db;
            --primary-dark: #2980b9;
            --secondary: #2c3e50;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --light: #ecf0f1;
            --dark: #2c3e50;
            --gray: #95a5a6;
            --light-gray: #f8f9fa;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        
        .password-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .password-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .password-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .password-title {
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 0.5rem;
        }
        
        .password-subtitle {
            color: var(--gray);
            font-size: 1rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--secondary);
        }
        
        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
            background: white;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        .btn {
            padding: 1rem 2rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            width: 100%;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(52, 152, 219, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .alert {
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            display: none;
        }
        
        .alert-error {
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            color: var(--danger);
        }
        
        .alert-success {
            background: rgba(39, 174, 96, 0.1);
            border: 1px solid rgba(39, 174, 96, 0.3);
            color: var(--success);
        }
        
        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .password-requirements {
            background: rgba(52, 152, 219, 0.05);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--secondary);
        }
        
        .password-requirements ul {
            list-style: none;
            padding-left: 0;
            margin-top: 10px;
        }
        
        .password-requirements li {
            padding: 5px 0;
            display: flex;
            align-items: center;
        }
        
        .requirement-met {
            color: var(--success);
        }
        
        .requirement-not-met {
            color: var(--gray);
        }
        
        .user-info {
            background: rgba(52, 152, 219, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .user-info h4 {
            color: var(--primary);
            margin-bottom: 5px;
        }
        
        .user-info p {
            color: var(--secondary);
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="password-card">
        <div class="password-header">
            <div class="password-icon">🔐</div>
            <h1 class="password-title">Change Password</h1>
            <p class="password-subtitle">Please set your new password to continue</p>
        </div>

        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-success" id="successAlert"></div>

        <div id="userInfo" class="user-info">
            <!-- User info will be populated by JavaScript -->
        </div>

        <div class="password-requirements">
            <strong>Password Requirements:</strong>
            <ul>
                <li id="reqLength" class="requirement-not-met">• At least 6 characters</li>
            </ul>
        </div>

        <form id="passwordForm">
            <div class="form-group">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-input" placeholder="Enter new password" required>
            </div>
            
            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="changePasswordBtn">
                <span id="btnText">Change Password</span>
                <div class="loading-spinner" id="loadingSpinner"></div>
            </button>
        </form>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8080/api';
        
        // DOM Elements
        const passwordForm = document.getElementById('passwordForm');
        const changePasswordBtn = document.getElementById('changePasswordBtn');
        const btnText = document.getElementById('btnText');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const errorAlert = document.getElementById('errorAlert');
        const successAlert = document.getElementById('successAlert');
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const userInfoDiv = document.getElementById('userInfo');

        // Check if user should be here and display user info
        document.addEventListener('DOMContentLoaded', () => {
            const tempUser = localStorage.getItem('tempUser');
            if (!tempUser) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(tempUser);
            userInfoDiv.innerHTML = `
                <h4>Welcome, ${user.firstName} ${user.lastName}</h4>
                <p>${user.email} • ${user.role}</p>
                <small>You need to change your password before proceeding</small>
            `;
        });

        // Password validation - matches your backend requirement (at least 6 characters)
        function validatePassword(password) {
            const requirements = {
                length: password.length >= 6
            };

            // Update requirement indicators
            document.getElementById('reqLength').className = requirements.length ? 'requirement-met' : 'requirement-not-met';

            return requirements.length;
        }

        // Show loading state
        function setLoading(loading) {
            if (loading) {
                btnText.style.display = 'none';
                loadingSpinner.style.display = 'block';
                changePasswordBtn.disabled = true;
            } else {
                btnText.style.display = 'block';
                loadingSpinner.style.display = 'none';
                changePasswordBtn.disabled = false;
            }
        }

        // Show error message
        function showError(message) {
            errorAlert.textContent = message;
            errorAlert.style.display = 'block';
            successAlert.style.display = 'none';
        }

        // Show success message
        function showSuccess(message) {
            successAlert.textContent = message;
            successAlert.style.display = 'block';
            errorAlert.style.display = 'none';
        }

        // Redirect to appropriate dashboard based on role
        function redirectToDashboard(role) {
            let redirectUrl = '';
            switch(role) {
                case 'ADMIN':
                    redirectUrl = 'admin-dashboard.html';
                    break;
                case 'HR_MANAGER':
                    redirectUrl = 'hr-dashboard.html';
                    break;
                case 'DEPT_MANAGER':
                    redirectUrl = 'manager-dashboard.html';
                    break;
                case 'STAFF':
                    redirectUrl = 'staff-dashboard.html';
                    break;
                default:
                    redirectUrl = 'dashboard.html';
            }
            window.location.href = redirectUrl;
        }

        // Handle password form submission
        passwordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!newPassword || !confirmPassword) {
                showError('Please fill in all fields');
                return;
            }

            if (!validatePassword(newPassword)) {
                showError('Password must be at least 6 characters long');
                return;
            }

            if (newPassword !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            setLoading(true);

            try {
                const tempUser = JSON.parse(localStorage.getItem('tempUser'));
                console.log('Changing password for user:', tempUser.email);
                
                
                // Use your backend endpoint for password change
const response = await fetch(`${API_BASE_URL}/users/${tempUser.id}/change_password`, {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json',
    },
    body: newPassword // Send the password directly, no JSON.stringify
});

                if (response.ok) {
                    const updatedUser = await response.json();
                    console.log('Password changed successfully for:', updatedUser.email);
                    showSuccess('Password changed successfully! Redirecting to dashboard...');
                    
                    // Store user data in localStorage
                    localStorage.setItem('user', JSON.stringify(updatedUser));
                    localStorage.setItem('token', 'auth-token');
                    
                    // Clear temporary data
                    localStorage.removeItem('tempUser');
                    
                    // Redirect to appropriate dashboard after successful password change
                    setTimeout(() => {
                        redirectToDashboard(updatedUser.role);
                    }, 1500);
                    
                } else {
                    const errorText = await response.text();
                    console.error('Password change failed:', errorText);
                    showError(errorText || 'Failed to change password');
                    setLoading(false);
                }
            } catch (error) {
                console.error('Password change error:', error);
                showError('Network error. Please try again.');
                setLoading(false);
            }
        });

        // Real-time password validation
        newPasswordInput.addEventListener('input', function() {
            validatePassword(this.value);
        });
    </script>
</body>
</html>
